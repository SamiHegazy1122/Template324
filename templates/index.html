<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Todo Liste</title>
</head>
<body>
    <h1>Todo Liste</h1>

    <form method="POST" action="{{ url_for('add') }}">
        <input type="text" name="text" placeholder="Was ist zu tun?" required>
        <input type="date" name="date">
        <button type="submit">Hinzufügen</button>
    </form>

    <ul>
        {% for item in items %}
        <li>
            <span style="{% if item.isCompleted %}text-decoration: line-through;{% endif %}">
                {{ item.text }} - Fällig: {{ item.datetime.strftime("%d.%m.%Y") }}
            </span>
            <form method="POST" action="{{ url_for('update', index=loop.index0) }}" style="display:inline;">
                <button type="submit">
                    {% if item.isCompleted %}Rückgängig{% else %}Erledigt{% endif %}
                </button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
